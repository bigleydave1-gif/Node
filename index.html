<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Vision Bridge v0.1</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    min-height:100%;
    background:#11151a;
    color:#eef2f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    padding:16px;
}

h1{
    margin:0 0 4px;
    font-size:26px;
}

.subtitle{
    color:#9da8b3;
    margin-bottom:18px;
}

.panel{
    background:#1a2027;
    border:1px solid #303943;
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
}

button{
    appearance:none;
    border:0;
    border-radius:12px;
    padding:13px 16px;
    margin:4px;
    background:#2d3742;
    color:white;
    font-size:15px;
    font-weight:600;
}

button:active{
    transform:scale(.97);
}

input[type=file]{
    width:100%;
    padding:12px;
    border-radius:12px;
    background:#252d35;
    color:white;
}

canvas{
    width:100%;
    max-width:640px;
    display:block;
    margin:10px auto;
    border-radius:12px;
    image-rendering:auto;
    background:#000;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.metric{
    background:#11161b;
    border-radius:10px;
    padding:10px;
}

.metric b{
    display:block;
    font-size:20px;
}

.metric span{
    color:#8e9aa5;
    font-size:12px;
}

pre{
    white-space:pre-wrap;
    word-break:break-word;
    background:#0c1014;
    padding:14px;
    border-radius:12px;
    max-height:420px;
    overflow:auto;
    font-size:11px;
    line-height:1.45;
}

#status{
    color:#8ed6a8;
    margin-top:8px;
}

#video{
    width:100%;
    max-width:640px;
    display:none;
    border-radius:12px;
    margin:10px auto;
}

.small{
    color:#89949e;
    font-size:12px;
    line-height:1.5;
}
</style>
</head>

<body>

<h1>👁️ Vision Bridge</h1>

<div class="subtitle">
Universal visual representation — v0.1
</div>

<div class="panel">

    <input id="fileInput"
           type="file"
           accept="image/*">

    <div style="margin-top:10px">
        <button id="cameraBtn">📷 Camera</button>
        <button id="analyzeBtn">🔬 Analyze</button>
        <button id="downloadBtn">💾 Vision JSON</button>
    </div>

    <video id="video"
           autoplay
           playsinline></video>

    <canvas id="sourceCanvas"></canvas>

    <div id="status">
        Waiting for an image…
    </div>

</div>


<div class="panel">

    <h3>Visual Layers</h3>

    <div class="grid">

        <div class="metric">
            <b id="res16">—</b>
            <span>16×16</span>
        </div>

        <div class="metric">
            <b id="res32">—</b>
            <span>32×32</span>
        </div>

        <div class="metric">
            <b id="res64">—</b>
            <span>64×64</span>
        </div>

        <div class="metric">
            <b id="regionCount">—</b>
            <span>Regions</span>
        </div>

        <div class="metric">
            <b id="edgeDensity">—</b>
            <span>Edges</span>
        </div>

        <div class="metric">
            <b id="contrast">—</b>
            <span>Contrast</span>
        </div>

    </div>

</div>


<div class="panel">

    <h3>🔬 Coarse Visual Reconstruction</h3>

    <canvas id="preview16"
            width="16"
            height="16"></canvas>

    <canvas id="preview32"
            width="32"
            height="32"></canvas>

    <canvas id="preview64"
            width="64"
            height="64"></canvas>

</div>


<div class="panel">

    <h3>📐 Geometry</h3>

    <pre id="geometryOutput">No analysis yet.</pre>

</div>


<div class="panel">

    <h3>🧠 Vision Packet</h3>

    <pre id="packetOutput">No packet yet.</pre>

</div>


<script>

"use strict";


/* =========================================================
   VISION BRIDGE
   ========================================================= */

const state = {

    image:null,

    packet:null,

    cameraStream:null

};


/* =========================================================
   ELEMENTS
   ========================================================= */

const fileInput =
    document.getElementById("fileInput");

const sourceCanvas =
    document.getElementById("sourceCanvas");

const sourceCtx =
    sourceCanvas.getContext("2d",{willReadFrequently:true});

const status =
    document.getElementById("status");

const analyzeBtn =
    document.getElementById("analyzeBtn");

const downloadBtn =
    document.getElementById("downloadBtn");

const cameraBtn =
    document.getElementById("cameraBtn");

const video =
    document.getElementById("video");


/* =========================================================
   FILE LOADING
   ========================================================= */

fileInput.addEventListener("change",async e=>{

    const file = e.target.files[0];

    if(!file) return;

    try{

        const url =
            URL.createObjectURL(file);

        const img =
            new Image();

        img.onload=()=>{

            state.image=img;

            drawSource();

            status.textContent =
                `Loaded ${img.naturalWidth} × ${img.naturalHeight}`;

            URL.revokeObjectURL(url);

        };

        img.src=url;

    }catch(err){

        status.textContent =
            "Image loading failed: "+err.message;

    }

});


/* =========================================================
   SOURCE IMAGE
   ========================================================= */

function drawSource(){

    if(!state.image) return;

    const img=state.image;

    const maxWidth=900;

    const scale =
        Math.min(1,maxWidth/img.naturalWidth);

    const w =
        Math.max(1,
            Math.round(img.naturalWidth*scale));

    const h =
        Math.max(1,
            Math.round(img.naturalHeight*scale));

    sourceCanvas.width=w;
    sourceCanvas.height=h;

    sourceCtx.clearRect(
        0,0,w,h
    );

    sourceCtx.drawImage(
        img,
        0,
        0,
        w,
        h
    );

}


/* =========================================================
   RESIZE / SAMPLE
   ========================================================= */

function makeRepresentation(size){

    const canvas =
        document.createElement("canvas");

    canvas.width=size;
    canvas.height=size;

    const ctx =
        canvas.getContext(
            "2d",
            {willReadFrequently:true}
        );

    ctx.drawImage(
        state.image,
        0,
        0,
        size,
        size
    );

    const imageData =
        ctx.getImageData(
            0,
            0,
            size,
            size
        );

    return {

        size,

        canvas,

        data:imageData.data

    };

}


/* =========================================================
   RGB
   ========================================================= */

function pixelRGB(data,index){

    return {

        r:data[index],

        g:data[index+1],

        b:data[index+2]

    };

}


/* =========================================================
   LUMINANCE
   ========================================================= */

function luminance(r,g,b){

    return (
        0.2126*r+
        0.7152*g+
        0.0722*b
    );

}


/* =========================================================
   REPRESENTATION ANALYSIS
   ========================================================= */

function analyzeRepresentation(rep){

    const size=rep.size;
    const data=rep.data;

    const pixels=[];

    let totalLum=0;
    let totalLum2=0;
    let edgePixels=0;

    const gray =
        new Float32Array(
            size*size
        );


    /* -------------------------
       READ PIXELS
       ------------------------- */

    for(let y=0;y<size;y++){

        for(let x=0;x<size;x++){

            const i=
                (y*size+x)*4;

            const p=
                pixelRGB(data,i);

            const lum=
                luminance(
                    p.r,
                    p.g,
                    p.b
                );

            gray[y*size+x]=lum;

            totalLum+=lum;
            totalLum2+=lum*lum;

            pixels.push([
                p.r,
                p.g,
                p.b
            ]);

        }

    }


    const count=size*size;

    const mean=
        totalLum/count;

    const variance=
        Math.max(
            0,
            totalLum2/count-
            mean*mean
        );

    const std=
        Math.sqrt(variance);


    /* -------------------------
       EDGES
       ------------------------- */

    const edges=
        new Uint8Array(
            size*size
        );

    let edgeSum=0;


    for(let y=1;y<size-1;y++){

        for(let x=1;x<size-1;x++){

            const p=
                y*size+x;

            const gx=
                gray[p+1]-
                gray[p-1];

            const gy=
                gray[p+size]-
                gray[p-size];

            const magnitude=
                Math.sqrt(
                    gx*gx+
                    gy*gy
                );

            if(magnitude>35){

                edges[p]=1;

                edgePixels++;

            }

            edgeSum+=magnitude;

        }

    }


    const edgeDensity=
        edgePixels/count;


    /* -------------------------
       SALIENT MASK
       ------------------------- */

    const mask=
        new Uint8Array(
            size*size
        );

    const threshold=
        Math.max(
            20,
            std*0.55
        );


    for(let i=0;i<count;i++){

        if(
            Math.abs(gray[i]-mean)>=threshold ||
            edges[i]
        ){

            mask[i]=1;

        }

    }


    /* -------------------------
       REGIONS
       ------------------------- */

    const regions=
        findRegions(
            mask,
            size
        );


    /* -------------------------
       RELATIONSHIPS
       ------------------------- */

    const relationships=
        [];

    for(
        let a=0;
        a<Math.min(regions.length,24);
        a++
    ){

        for(
            let b=a+1;
            b<Math.min(regions.length,24);
            b++
        ){

            const A=regions[a];
            const B=regions[b];

            const rel=
                [];

            if(
                B.center.x >
                A.center.x+0.05
            )
                rel.push("RIGHT_OF");

            if(
                B.center.x <
                A.center.x-0.05
            )
                rel.push("LEFT_OF");

            if(
                B.center.y >
                A.center.y+0.05
            )
                rel.push("BELOW");

            if(
                B.center.y <
                A.center.y-0.05
            )
                rel.push("ABOVE");


            const dx=
                B.center.x-
                A.center.x;

            const dy=
                B.center.y-
                A.center.y;

            const distance=
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(rel.length){

                relationships.push({

                    a:A.id,

                    b:B.id,

                    relations:rel,

                    centerDistance:
                        Number(
                            distance.toFixed(4)
                        )

                });

            }

        }

    }


    return {

        resolution:[
            size,
            size
        ],

        meanLuminance:
            Number(mean.toFixed(3)),

        contrast:
            Number(std.toFixed(3)),

        edgeDensity:
            Number(edgeDensity.toFixed(4)),

        pixelsRGB:pixels,

        regions,

        relationships

    };

}


/* =========================================================
   REGION DETECTION
   ========================================================= */

function findRegions(mask,size){

    const visited=
        new Uint8Array(
            size*size
        );

    const regions=[];

    const minimumArea=
        Math.max(
            2,
            Math.floor(
                size*size/2500
            )
        );


    for(let y=0;y<size;y++){

        for(let x=0;x<size;x++){

            const start=
                y*size+x;

            if(
                !mask[start] ||
                visited[start]
            )
                continue;


            const queue=[
                [x,y]
            ];

            visited[start]=1;

            const points=[];


            while(queue.length){

                const [px,py]=
                    queue.pop();

                points.push([
                    px,
                    py
                ]);


                const neighbors=[
                    [px+1,py],
                    [px-1,py],
                    [px,py+1],
                    [px,py-1]
                ];


                for(
                    const [nx,ny]
                    of neighbors
                ){

                    if(
                        nx<0 ||
                        ny<0 ||
                        nx>=size ||
                        ny>=size
                    )
                        continue;


                    const ni=
                        ny*size+nx;


                    if(
                        mask[ni] &&
                        !visited[ni]
                    ){

                        visited[ni]=1;

                        queue.push([
                            nx,
                            ny
                        ]);

                    }

                }

            }


            if(
                points.length<
                minimumArea
            )
                continue;


            let minX=size;
            let minY=size;
            let maxX=0;
            let maxY=0;

            let sumX=0;
            let sumY=0;


            for(
                const [px,py]
                of points
            ){

                minX=
                    Math.min(
                        minX,
                        px
                    );

                minY=
                    Math.min(
                        minY,
                        py
                    );

                maxX=
                    Math.max(
                        maxX,
                        px
                    );

                maxY=
                    Math.max(
                        maxY,
                        py
                    );

                sumX+=px;
                sumY+=py;

            }


            const area=
                points.length;

            regions.push({

                id:regions.length+1,

                areaPixels:area,

                areaFraction:
                    Number(
                        (
                            area/
                            (size*size)
                        ).toFixed(6)
                    ),

                bbox:{

                    x:minX,

                    y:minY,

                    width:
                        maxX-minX+1,

                    height:
                        maxY-minY+1

                },

                bboxNormalized:{

                    x:Number(
                        (minX/size)
                        .toFixed(4)
                    ),

                    y:Number(
                        (minY/size)
                        .toFixed(4)
                    ),

                    width:Number(
                        (
                            (maxX-minX+1)/
                            size
                        ).toFixed(4)
                    ),

                    height:Number(
                        (
                            (maxY-minY+1)/
                            size
                        ).toFixed(4)
                    )

                },

                center:{

                    x:Number(
                        (
                            sumX/
                            area/
                            Math.max(1,size-1)
                        ).toFixed(4)
                    ),

                    y:Number(
                        (
                            sumY/
                            area/
                            Math.max(1,size-1)
                        ).toFixed(4)
                    )

                }

            });

        }

    }


    regions.sort(
        (a,b)=>
            b.areaPixels-
            a.areaPixels
    );


    return regions.slice(
        0,
        64
    );

}


/* =========================================================
   PREVIEW
   ========================================================= */

function drawPreview(
    rep,
    canvasId
){

    const canvas=
        document.getElementById(
            canvasId
        );

    const ctx=
        canvas.getContext("2d");

    canvas.width=
        rep.size;

    canvas.height=
        rep.size;

    ctx.imageSmoothingEnabled=false;

    ctx.drawImage(
        rep.canvas,
        0,
        0
    );

}


/* =========================================================
   MAIN ANALYSIS
   ========================================================= */

function analyzeImage(){

    if(!state.image){

        status.textContent=
            "Please select an image first.";

        return;

    }


    status.textContent=
        "Scanning visual information…";


    const rep16=
        makeRepresentation(16);

    const rep32=
        makeRepresentation(32);

    const rep64=
        makeRepresentation(64);


    const a16=
        analyzeRepresentation(rep16);

    const a32=
        analyzeRepresentation(rep32);

    const a64=
        analyzeRepresentation(rep64);


    drawPreview(
        rep16,
        "preview16"
    );

    drawPreview(
        rep32,
        "preview32"
    );

    drawPreview(
        rep64,
        "preview64"
    );


    const packet={

        visionBridge:"0.1",

        type:"image",

        source:{

            width:
                state.image.naturalWidth,

            height:
                state.image.naturalHeight,

            aspectRatio:
                Number(
                    (
                        state.image.naturalWidth/
                        state.image.naturalHeight
                    ).toFixed(5)
                )

        },

        coordinateSystem:{

            origin:"top-left",

            x:"right",

            y:"down",

            normalizedRange:
                "0.0-1.0"

        },

        representations:{

            "16x16":a16,

            "32x32":a32,

            "64x64":a64

        },

        llmInstructions:

            "Treat this packet as visual observation data. "+
            "Use color and pixel information for appearance. "+
            "Use regions and geometry for structure. "+
            "Use relationships for spatial reasoning. "+
            "Do not invent visual information unsupported by "+
            "the packet. Request a higher-resolution crop "+
            "when additional detail is required."

    };


    state.packet=packet;


    document.getElementById(
        "res16"
    ).textContent="READY";

    document.getElementById(
        "res32"
    ).textContent="READY";

    document.getElementById(
        "res64"
    ).textContent="READY";


    document.getElementById(
        "regionCount"
    ).textContent=
        a64.regions.length;


    document.getElementById(
        "edgeDensity"
    ).textContent=
        a64.edgeDensity;


    document.getElementById(
        "contrast"
    ).textContent=
        a64.contrast;


    document.getElementById(
        "geometryOutput"
    ).textContent=
        JSON.stringify({

            resolution:"64x64",

            regions:a64.regions,

            relationships:
                a64.relationships

        },null,2);


    document.getElementById(
        "packetOutput"
    ).textContent=
        JSON.stringify(
            packet,
            null,
            2
        );


    status.textContent=
        "Vision scan complete.";

}


/* =========================================================
   DOWNLOAD JSON
   ========================================================= */

downloadBtn.addEventListener(
    "click",
    ()=>{

        if(!state.packet){

            status.textContent=
                "Analyze an image first.";

            return;

        }


        const blob=
            new Blob(
                [
                    JSON.stringify(
                        state.packet,
                        null,
                        2
                    )
                ],
                {
                    type:
                        "application/json"
                }
            );


        const url=
            URL.createObjectURL(blob);

        const a=
            document.createElement("a");

        a.href=url;

        a.download=
            "vision_packet.json";

        document.body.appendChild(a);

        a.click();

        a.remove();

        URL.revokeObjectURL(url);

    }
);


/* =========================================================
   CAMERA
   ========================================================= */

cameraBtn.addEventListener(
    "click",
    async()=>{

        try{

            if(state.cameraStream){

                state.cameraStream
                    .getTracks()
                    .forEach(
                        track=>
                            track.stop()
                    );

                state.cameraStream=null;

                video.style.display=
                    "none";

                cameraBtn.textContent=
                    "📷 Camera";

                return;

            }


            const stream=
                await navigator.mediaDevices
                    .getUserMedia({

                        video:{
                            facingMode:{
                                ideal:"environment"
                            }
                        },

                        audio:false

                    });


            state.cameraStream=
                stream;

            video.srcObject=
                stream;

            video.style.display=
                "block";

            cameraBtn.textContent=
                "⏹ Stop Camera";

            status.textContent=
                "Camera active.";

        }catch(err){

            status.textContent=
                "Camera unavailable: "+
                err.message;

        }

    }
);


/* =========================================================
   CAMERA FRAME CAPTURE
   ========================================================= */

video.addEventListener(
    "click",
    ()=>{

        if(
            !video.videoWidth ||
            !video.videoHeight
        )
            return;


        const canvas=
            document.createElement(
                "canvas"
            );

        canvas.width=
            video.videoWidth;

        canvas.height=
            video.videoHeight;

        const ctx=
            canvas.getContext("2d");

        ctx.drawImage(
            video,
            0,
            0
        );


        const img=
            new Image();

        img.onload=()=>{

            state.image=img;

            drawSource();

            analyzeImage();

        };


        img.src=
            canvas.toDataURL(
                "image/jpeg",
                0.92
            );

    }
);


/* =========================================================
   BUTTON
   ========================================================= */

analyzeBtn.addEventListener(
    "click",
    analyzeImage
);


/* =========================================================
   START
   ========================================================= */

status.textContent=
    "Vision Bridge ready.";

</script>

</body>
</html>
