function normalizeToHeight(model, desiredHeight){
  model.scale.set(1,1,1);
  model.position.set(0,0,0);
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const dim = Math.max(size.y, 0.0001);
  const scale = desiredHeight / dim;
  model.scale.setScalar(scale);

  const newBox = new THREE.Box3().setFromObject(model);
  const center = newBox.getCenter(new THREE.Vector3());
  model.position.x -= center.x;
  model.position.z -= center.z;
  model.position.y -= newBox.min.y;
}

/* raw meshes collected while the city loads (used once to bake bounds) */
const colliders = [];

/* =========================================================
   ★ BAKED COLLISION ★
   Instead of raycasting the full city mesh every frame, we
   compute a static list of axis-aligned bounding boxes (+ a
   bounding-sphere for cheap rejection) ONE TIME when the city
   finishes loading. All runtime collision (player movement,
   ground height, projectile impacts) is then done with plain
   sphere/box math — no THREE.Raycaster anywhere in the game.
   ========================================================= */
const cityColliderBoxes = [];

function bakeCityCollision(){
  cityColliderBoxes.length = 0;
  for(const o of colliders){
    o.updateWorldMatrix(true,false);
    const box = new THREE.Box3().setFromObject(o);
    if(box.isEmpty()) continue;
    const sphere = box.getBoundingSphere(new THREE.Sphere());
    cityColliderBoxes.push({
      min:box.min.clone(), max:box.max.clone(),
      center:sphere.center.clone(), radius:sphere.radius
    });
  }
  // free the raw mesh references, we only need the baked boxes from now on
  colliders.length = 0;
}

function sphereIntersectsBox(center, radius, b){
  const cx = Math.max(b.min.x, Math.min(center.x, b.max.x));
  const cy = Math.max(b.min.y, Math.min(center.y, b.max.y));
  const cz = Math.max(b.min.z, Math.min(center.z, b.max.z));
  const dx = center.x-cx, dy = center.y-cy, dz = center.z-cz;
  return (dx*dx+dy*dy+dz*dz) <= radius*radius;
}

function citySphereBlocked(center, radius){
  for(const b of cityColliderBoxes){
    const dx=center.x-b.center.x, dy=center.y-b.center.y, dz=center.z-b.center.z;
    const rr=radius+b.radius;
    if(dx*dx+dy*dy+dz*dz > rr*rr) continue; // cheap reject
    if(sphereIntersectsBox(center, radius, b)) return true;
  }
  return false;
}

/* highest baked box "roof" under a given XZ, else the flat ground plane (y=0) */
function groundLevelAt(pos){
  let top = 0;
  for(const b of cityColliderBoxes){
    if(pos.x>=b.min.x-0.5 && pos.x<=b.max.x+0.5 && pos.z>=b.min.z-0.5 && pos.z<=b.max.z+0.5){
      if(b.max.y>top) top=b.max.y;
    }
  }
  return top;
}

    // Center X/Z

    city.position.x -= center.x;
    city.position.z -= center.z;

    // Put bottom of map on y=0
    city.position.y += 1;

    city.traverse(o => {

        // Fix transparent faces
        o.material = o.material.clone();
        o.material.side = THREE.DoubleSide;

        o.material.transparent = false;
        o.material.opacity = 1;

    });

document.addEventListener("pointerlockchange",()=>{ mouseLook=!!document.pointerLockElement; });
addEventListener("mousemove",e=>{
  if(!mouseLook) return;
  yaw -= e.movementX*0.002;
  pitch -= e.movementY*0.002;
  pitch=Math.max(-1.2,Math.min(1.2,pitch));
});

/* ============ FIRE ============ */
const fireBtn = document.getElementById("fireBtn");
let manualFire=false;
fireBtn.addEventListener("touchstart",e=>{e.preventDefault();manualFire=true;},{passive:false});
fireBtn.addEventListener("touchend",e=>{e.preventDefault();manualFire=false;},{passive:false});
addEventListener("mousedown",e=>{ if(started && mouseLook) manualFire=true; });
addEventListener("mouseup",()=>manualFire=false);

/* ============ MOVEMENT (capsule/sphere collision, zero raycasts) ============ */
const velocity=new THREE.Vector3();
const moveDir=new THREE.Vector3();
const speed=0.25, gravity=0.02, friction=0.72, height=1.7;
const PLAYER_MOVE_RADIUS=0.6;
let grounded=false;

/* ============ WEAPONS: bullets (Stu/blake) + proj#.glb (everyone else) ============ */
const MAX_RANGE=200;
const PROJ_LIFE_MS = (MAX_RANGE/PROJ_SPEED) * (1000/60) + 300; // depends on proj velocity/range
const activeProjectiles = [];
const activeBullets = [];

/* shared tiny-blue-dot geometry/material — bullets are identical and static,
   so every bullet instance reuses these instead of allocating new buffers */
const BULLET_GEO = new THREE.SphereGeometry(0.15, 6, 6);
const BULLET_MAT = new THREE.MeshBasicMaterial({color:0x2fc3ff});

function loadProjectileModel(url, onReady){
  if(projGLBCache[url]){ onReady(projGLBCache[url]); return; }
  new GLTFLoader().load(url, (gltf)=>{ projGLBCache[url]=gltf; onReady(gltf); });
}

/* ---- proj#.glb (slow-firing model projectiles) ---- */
function spawnProjectile(origin, dir, ownerId, ownerTeam, charIdx, resolveHits){
  const charDef = CHARACTERS[charIdx||0] || CHARACTERS[0];
  const def = PROJECTILES[charDef.proj] || PROJECTILES.proj1;
  const dirN = dir.clone().normalize();
  const proj = {
    mesh:null, mixer:null,
    pos:origin.clone(), dir:dirN,
    ownerId, ownerTeam,
    born:performance.now(),
    resolveHits: !!resolveHits,
    alive:true, traveled:0
  };
  activeProjectiles.push(proj);

  loadProjectileModel(def.url, (gltf)=>{
    if(!proj.alive) return; // removed before it finished loading
    const inst = SkeletonUtils.clone(gltf.scene);
    normalizeToHeight(inst, PROJ_SIZE);

    // each projectile gets its own material instances so tinting/opacity
    // never leaks between simultaneously-flying shots
    inst.traverse(o=>{
      if(o.isMesh){
        o.material = o.material.clone();
        o.material.side = THREE.DoubleSide;
      }
    });

    const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,-1), dirN);
    inst.quaternion.copy(quat);
    inst.position.copy(origin);
    scene.add(inst);
    proj.mesh = inst;

    const clips = gltf.animations||[];
    if(clips.length){
      proj.mixer = new THREE.AnimationMixer(inst);
      proj.mixer.clipAction(clips[0]).play();
    }
  });
}

function removeProjectile(p){
  p.alive=false;
  if(p.mesh){ scene.remove(p.mesh); }
}

function updateProjectiles(){
  const now = performance.now();
  for(let i=activeProjectiles.length-1;i>=0;i--){
    const p = activeProjectiles[i];
    if(!p.alive){ activeProjectiles.splice(i,1); continue; }

    const step = p.dir.clone().multiplyScalar(PROJ_SPEED);
    p.pos.add(step);
    p.traveled += PROJ_SPEED;
    if(p.mesh) p.mesh.position.copy(p.pos);
    if(p.mixer) p.mixer.update(0.016);

    let hit=false;

    // wall / city impact (sphere vs baked box, no raycast)
    if(citySphereBlocked(p.pos, PROJ_HIT_RADIUS)) hit=true;

    // enemy impact — only the shooter's own client resolves damage
    if(!hit && p.resolveHits){
      for(const id in remote){
        const rp=remote[id];
        if(!rp || rp.team===p.ownerTeam || rp.hp<=0) continue;
        const center = rp.mesh.position.clone().add(new THREE.Vector3(0,PLAYER_HEIGHT*0.5,0));
        const dx=p.pos.x-center.x, dy=p.pos.y-center.y, dz=p.pos.z-center.z;
        const rr = PLAYER_HIT_RADIUS+PROJ_HIT_RADIUS;
        if(dx*dx+dy*dy+dz*dz <= rr*rr){
          channel.send({type:"broadcast",event:"hit",payload:{
            target:id, from:p.ownerId, fromName:myName, fromTeam:p.ownerTeam, damage:PROJ_DAMAGE
          }});
          flashHitmarker();
          hit=true;
          break;
        }
      }
    }

    if(hit || p.traveled>=MAX_RANGE || (now-p.born)>=PROJ_LIFE_MS){
      removeProjectile(p);
      activeProjectiles.splice(i,1);
    }
  }
}

/* ---- bullets: tiny blue dot, high velocity, fixed 3s lifespan ---- */
function spawnBullet(origin, dir, ownerId, ownerTeam, resolveHits){
  const dirN = dir.clone().normalize();
  const mesh = new THREE.Mesh(BULLET_GEO, BULLET_MAT);
  mesh.position.copy(origin);
  scene.add(mesh);
  activeBullets.push({
    mesh, pos:origin.clone(), dir:dirN,
    ownerId, ownerTeam,
    born:performance.now(),
    resolveHits: !!resolveHits,
    alive:true
  });
}

function removeBullet(b){
  b.alive=false;
  if(b.mesh) scene.remove(b.mesh);
}

function updateBullets(){
  const now = performance.now();
  for(let i=activeBullets.length-1;i>=0;i--){
    const b = activeBullets[i];
    if(!b.alive){ activeBullets.splice(i,1); continue; }

    b.pos.addScaledVector(b.dir, BULLET_SPEED);
    b.mesh.position.copy(b.pos);

    let hit=false;
    if(citySphereBlocked(b.pos, BULLET_HIT_RADIUS)) hit=true;

    if(!hit && b.resolveHits){
      for(const id in remote){
        const rp=remote[id];
        if(!rp || rp.team===b.ownerTeam || rp.hp<=0) continue;
        const center = rp.mesh.position.clone().add(new THREE.Vector3(0,PLAYER_HEIGHT*0.5,0));
        const dx=b.pos.x-center.x, dy=b.pos.y-center.y, dz=b.pos.z-center.z;
        const rr = PLAYER_HIT_RADIUS+BULLET_HIT_RADIUS;
        if(dx*dx+dy*dy+dz*dz <= rr*rr){
          channel.send({type:"broadcast",event:"hit",payload:{
            target:id, from:b.ownerId, fromName:myName, fromTeam:b.ownerTeam, damage:BULLET_DAMAGE
          }});
          flashHitmarker();
          hit=true;
          break;
        }
      }
    }

    if(hit || (now-b.born)>=BULLET_LIFE_MS){
      removeBullet(b);
      activeBullets.splice(i,1);
    }
  }
}

let lastFire=0;
function tryFire(){
  const wpn = (CHARACTERS[myChar] && CHARACTERS[myChar].weapon) || "bullet";
  const rate = wpn==="bullet" ? BULLET_FIRE_RATE : PROJ_FIRE_RATE;
  if(performance.now()-lastFire < rate) return;
  lastFire=performance.now();
  const dir=new THREE.Vector3(); camera.getWorldDirection(dir);
  const origin=camera.getWorldPosition(new THREE.Vector3());
  if(wpn==="bullet"){
    spawnBullet(origin,dir,localID,myTeam,true);
  } else {
    spawnProjectile(origin,dir,localID,myTeam,myChar,true);
  }
  channel.send({type:"broadcast",event:"bullet",payload:{
    x:origin.x,y:origin.y,z:origin.z,dx:dir.x,dy:dir.y,dz:dir.z,id:localID,team:myTeam,char:myChar,wpn
  }});
}

/* ============ AIM ASSIST / AUTO FIRE (pure vector math, no raycast) ============ */
const crosshairEl = document.getElementById("crosshair");
const AIM_MAX_RANGE=200, AIM_MAX_ANGLE_COS=Math.cos(THREE.MathUtils.degToRad(3.5));
let aimTick=0, lastAimEnemy=null;
const _fwd=new THREE.Vector3(), _origin=new THREE.Vector3(), _toEnemy=new THREE.Vector3();
function aimedAtEnemy(){
  camera.getWorldDirection(_fwd);
  camera.getWorldPosition(_origin);
  let best=null, bestCos=AIM_MAX_ANGLE_COS;
  for(const id in remote){
    const p=remote[id];
    if(!p || p.team===myTeam || p.hp<=0) continue;
    const center = p.mesh.position.clone().add(new THREE.Vector3(0,PLAYER_HEIGHT*0.5,0));
    _toEnemy.copy(center).sub(_origin);
    const dist=_toEnemy.length();
    if(dist>AIM_MAX_RANGE || dist<0.001) continue;
    _toEnemy.normalize();
    const c=_fwd.dot(_toEnemy);
    if(c>bestCos){
      // make sure a building isn't standing directly between us
      const steps=6;
      let blocked=false;
      for(let s=1;s<=steps;s++){
        const t=(dist*s)/steps;
        const testPt=_origin.clone().addScaledVector(_toEnemy,t);
        if(citySphereBlocked(testPt, 0.4)){ blocked=true; break; }
      }
      if(!blocked){ bestCos=c; best=id; }
    }
  }
  return best;
}

/* ============ REMOTE PLAYERS ============ */
const remote={};
function makeRemote(id,team,name,charIdx){
  const group=new THREE.Group();
  const teamColor = team==="red"?0xff3b4d:0x3b8fff;
  const cc = CHARACTERS[charIdx||0] || CHARACTERS[0];

  // nameplate — a fresh canvas/texture per player, never shared
  const cv=document.createElement("canvas"); cv.width=256; cv.height=64;
  const ctx=cv.getContext("2d");
  ctx.fillStyle = team==="red"?"#ff3b4d":"#3b8fff";
  ctx.font="bold 32px Arial"; ctx.textAlign="center";
  ctx.fillText(name||"player", 128, 42);
  const tex=new THREE.CanvasTexture(cv);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));
  spr.scale.set(1,1,1); spr.position.y=PLAYER_HEIGHT-0.5; group.add(spr);
  scene.add(group);

  const p={
    mesh:group, target:new THREE.Vector3(), yaw:0,
    mixer:null, actions:{}, current:null,
    team:team||"red", name:name||"player", hp:100, char:charIdx||0
  };

  const charUrl = cc.url;
  const onGLB = (gltf)=>{
    // clone so each player has fully independent transforms, mixer & materials
    const av = SkeletonUtils.clone(gltf.scene);
    normalizeToHeight(av, PLAYER_HEIGHT); // <- every character ends up the same height
    av.rotation.y = Math.PI;

    av.traverse(o=>{
      if(o.isMesh){
        const srcTex = o.material && o.material.map ? o.material.map : null;
        o.material = new THREE.MeshStandardMaterial({
          map: srcTex,
          color: 0xffffff,
          roughness: 0.8,
          metalness: 0.1,
          skinning: true
        });
        o.castShadow = true;
        o.receiveShadow = true;
      }
    });
    group.add(av);

    // own mixer + own action instances (nothing shared with other players)
    const mixer=new THREE.AnimationMixer(av);
    p.mixer=mixer;
    const clips=gltf.animations||[];
    const pick=(...names)=>{
      for(const n of names){
        const c=clips.find(c=>c.name.toLowerCase().includes(n));
        if(c) return c;
      }
      return null;
    };
    const idle = pick("idle","stand") || clips[0];
    const walk = pick("walk") || clips[1] || idle;
    const run  = pick("run","sprint") || walk;
    const shoot= pick("shoot","fire","attack") || idle;
    if(idle){ p.actions.idle=mixer.clipAction(idle); p.actions.idle.play(); p.current=p.actions.idle; }
    if(walk && walk!==idle) p.actions.walk=mixer.clipAction(walk);
    if(run && run!==walk) p.actions.run=mixer.clipAction(run);
    if(shoot && shoot!==idle){ p.actions.shoot=mixer.clipAction(shoot); p.actions.shoot.setLoop(THREE.LoopOnce); }
  };
  if(charGLBCache[charUrl]){ onGLB(charGLBCache[charUrl]); }
  else {
    new GLTFLoader().load(charUrl, (gltf)=>{ charGLBCache[charUrl]=gltf; onGLB(gltf); });
  }
  return p;
}
function setAnim(p, name){
  if(!p.actions[name] || p.current===p.actions[name]) return;
  const next=p.actions[name];
  if(p.current) p.current.fadeOut(0.15);
  next.reset().fadeIn(0.15).play();
  p.current=next;
}
function playShoot(p){
  if(p.actions.shoot){ p.actions.shoot.reset().play(); }
}

/* ============ CHANNEL ============ */
const channel = supabase.channel("snowtown-room", { config:{broadcast:{self:false}} });
channel.on("broadcast",{event:"join"},({payload})=>{
  if(!payload || payload.id===localID) return;
  if(!remote[payload.id]) remote[payload.id]=makeRemote(payload.id,payload.team,payload.name,payload.char);
  globalScores[payload.id] = {
    name:payload.name,team:payload.team,char:payload.char||0,
    kills:payload.kills||0,deaths:payload.deaths||0,t:Date.now()
  };
  renderLeaderboard();
  // reply with our state so they see us
  if(started){
    channel.send({type:"broadcast",event:"join",payload:{id:localID,name:myName,team:myTeam,char:myChar,kills,deaths}});
  }
});
channel.on("broadcast",{event:"bullet"},({payload})=>{
  if(!payload || payload.id===localID) return;
  const origin=new THREE.Vector3(payload.x,payload.y,payload.z);
  const dir=new THREE.Vector3(payload.dx,payload.dy,payload.dz);
  if(payload.wpn==="bullet"){
    spawnBullet(origin,dir,payload.id,payload.team,false);
  } else {
    spawnProjectile(origin,dir,payload.id,payload.team,payload.char,false);
  }
  const p=remote[payload.id]; if(p) playShoot(p);
});
channel.on("broadcast",{event:"state"},({payload})=>{
  if(!payload || payload.id===localID) return;
  let p=remote[payload.id];
  if(!p){ p = remote[payload.id] = makeRemote(payload.id,payload.team,payload.name,payload.char); }
  p.target.set(payload.x,payload.y,payload.z);
  p.yaw=payload.yaw;
  p.moving = !!payload.moving;
  p.running = !!payload.running;
  if(typeof payload.hp==="number") p.hp=payload.hp;
});
channel.on("broadcast",{event:"score"},({payload})=>{
  if(!payload || payload.id===localID) return;
  globalScores[payload.id] = {
    name:payload.name,team:payload.team,char:payload.char||0,
    kills:payload.kills||0,deaths:payload.deaths||0,t:Date.now()
  };
  renderLeaderboard();
});
channel.on("broadcast",{event:"scoreReq"},()=>{
  if(started) broadcastScore();
});
channel.on("broadcast",{event:"hit"},({payload})=>{
  if(!payload) return;
  if(payload.target===localID){
    myHP = Math.max(0, myHP - payload.damage);
    lastDamageFrom = payload.from;
    updateHUD();
    if(myHP<=0){ die(payload.from, payload.fromName, payload.fromTeam); }
  }
});
channel.on("broadcast",{event:"kill"},({payload})=>{
  if(!payload) return;
  teamScore[payload.killerTeam] = (teamScore[payload.killerTeam]||0) + 1;
  updateScoreboard();
  addKillFeed(`${payload.killerName} ▶ ${payload.victimName}`, payload.killerTeam);
  if(payload.killer===localID){ kills++; document.getElementById("hK").textContent=kills; broadcastScore(); }
  if(globalScores[payload.killer]){ globalScores[payload.killer].kills=(globalScores[payload.killer].kills||0)+1; }
  if(globalScores[payload.victim]){ globalScores[payload.victim].deaths=(globalScores[payload.victim].deaths||0)+1; }
  renderLeaderboard();
});
channel.on("broadcast",{event:"chat"},({payload})=>{
  if(!payload) return;
  addChat(payload.name, payload.team, payload.text);
});
channel.subscribe();
// when the menu is open, ask everyone to announce their score
setTimeout(()=>channel.send({type:"broadcast",event:"scoreReq",payload:{}}), 800);

function broadcastScore(){
  globalScores[localID] = {name:myName,team:myTeam,char:myChar,kills,deaths,t:Date.now()};
  renderLeaderboard();
  channel.send({type:"broadcast",event:"score",payload:{
    id:localID,name:myName,team:myTeam,char:myChar,kills,deaths
  }});
}

let lastSend=0;
function sync(){
  if(!started) return;
  const now=performance.now();
  if(now-lastSend<100) return;
  lastSend=now;
  const mv = Math.hypot(velocity.x,velocity.z);
  channel.send({type:"broadcast",event:"state",payload:{
    id:localID,name:myName,team:myTeam, char: myChar,
    x:player.position.x,y:player.position.y,z:player.position.z,
    yaw, hp:myHP, moving:mv>0.02, running:mv>0.15
  }});
}

/* ============ DAMAGE / DEATH ============ */
function updateHUD(){
  document.getElementById("hHP").textContent = myHP;
  document.getElementById("hHPbar").style.width = myHP+"%";
  document.getElementById("hHPbar").style.background = myHP>50?"#10b981":myHP>25?"#f59e0b":"#ef4444";
}
function updateScoreboard(){
  document.getElementById("sRed").textContent = teamScore.red||0;
  document.getElementById("sBlue").textContent = teamScore.blue||0;
}
function die(killerId, killerName, killerTeam){
  deaths++; document.getElementById("hD").textContent=deaths;
  channel.send({type:"broadcast",event:"kill",payload:{
    killer:killerId, killerName, killerTeam,
    victim:localID, victimName:myName, victimTeam:myTeam
  }});
  broadcastScore();
  // respawn
  setTimeout(()=>{
    player.position.copy(spawnPos());
    velocity.set(0,0,0); myHP=100; updateHUD();
  }, 1200);
}
function addKillFeed(text,team){
  const kf=document.getElementById("killfeed");
  const d=document.createElement("div"); d.innerHTML=`<span class="t${team}">${text}</span>`;
  kf.appendChild(d); if(kf.children.length>5) kf.removeChild(kf.firstChild);
  setTimeout(()=>d.remove(), 5000);
}
function flashHitmarker(){
  const hm=document.getElementById("hitmarker");
  hm.style.opacity=1; setTimeout(()=>hm.style.opacity=0,120);
}

/* ============ CHAT ============ */
const chatLog=document.getElementById("chatLog");
const chatInput=document.getElementById("chatInput");
document.getElementById("chatBtn").onclick=openChat;
function openChat(){ chatInput.style.display="block"; chatInput.focus(); }
function sendChat(){
  const t=chatInput.value.trim(); chatInput.value=""; chatInput.style.display="none";
  if(!t) return;
  addChat(myName,myTeam,t);
  channel.send({type:"broadcast",event:"chat",payload:{name:myName,team:myTeam,text:t}});
}
function addChat(name,team,text){
  const d=document.createElement("div");
  d.innerHTML=`<span class="t${team}"><b>${name}:</b></span> ${text.replace(/[<>]/g,"")}`;
  chatLog.appendChild(d);
  while(chatLog.children.length>6) chatLog.removeChild(chatLog.firstChild);
  setTimeout(()=>d.remove(),8000);
}

/* ============ LOOP ============ */
function updateMovement(){
  let f=(keys["w"]?1:0)-(keys["s"]?1:0) + (-joyY);
  let s=(keys["d"]?1:0)-(keys["a"]?1:0) + joyX;
  moveDir.set(s,0,-f);
  if(moveDir.length()>1) moveDir.normalize();
  moveDir.applyAxisAngle(new THREE.Vector3(0,1,0), yaw);

  // capsule (approximated as a sphere at chest height) vs baked city boxes
  const nextX = player.position.x + moveDir.x*speed;
  const nextZ = player.position.z + moveDir.z*speed;
  const testPoint = new THREE.Vector3(nextX, player.position.y+1.0, nextZ);
  const blocked = moveDir.lengthSq()>0.0001 && citySphereBlocked(testPoint, PLAYER_MOVE_RADIUS);

  if(!blocked){
    velocity.x=moveDir.x*speed; velocity.z=moveDir.z*speed;
  } else {
    velocity.x*=0.2; velocity.z*=0.2;
  }
  player.position.x+=velocity.x; player.position.z+=velocity.z;

  grounded=false;
  const groundY = groundLevelAt(player.position);
  const targetY = groundY + height;

  if(player.position.y<=targetY || velocity.y<=0){
    player.position.y = targetY;
    velocity.y = 0;
    grounded = true;
  }

  if(!grounded) velocity.y-=gravity;
  player.position.y+=velocity.y;
  velocity.x*=friction; velocity.z*=friction;
}

function updateRemotes(){
  for(const id in remote){
    const r=remote[id];
    r.mesh.position.lerp(r.target,0.25);
    r.mesh.rotation.y=r.yaw;
    if(r.mixer) r.mixer.update(0.016);
    if(r.actions.run && r.running) setAnim(r,"run");
    else if(r.actions.walk && r.moving) setAnim(r,"walk");
    else setAnim(r,"idle");
  }
}

function animate(){
  requestAnimationFrame(animate);
  if(started){
    updateMovement();
    player.rotation.y=yaw;
    camera.rotation.x=pitch;
    updateProjectiles();
    updateBullets();
    updateRemotes();

    // auto fire when enemy in crosshair (throttled — pure vector math, no raycast)
    aimTick=(aimTick+1)%3;
    if(aimTick===0){
      lastAimEnemy = aimedAtEnemy();
      if(lastAimEnemy) crosshairEl.classList.add("locked");
      else crosshairEl.classList.remove("locked");
    }

    if(manualFire || lastAimEnemy){
      tryFire();
    }

    sync();
  }
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
